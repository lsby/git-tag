<svg width="512" height="512" viewBox="90 10 332 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="free-grad-cyan-purple" x1="120" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/> <!-- Cyan 400 -->
      <stop offset="50%" stop-color="#818CF8"/> <!-- Indigo 400 -->
      <stop offset="100%" stop-color="#C084FC"/> <!-- Purple 400 -->
    </linearGradient>
    <linearGradient id="free-grad-pink-orange" x1="200" y1="200" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/> <!-- Pink 400 -->
      <stop offset="100%" stop-color="#FB923C"/> <!-- Orange 400 -->
    </linearGradient>
    
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景微光，提升质感 -->
  <circle cx="256" cy="256" r="180" fill="url(#free-grad-cyan-purple)" opacity="0.12" filter="url(#glow-heavy)" />

  <!-- 吊牌主体组 (整体倾斜 15 度) -->
  <g transform="rotate(-15, 256, 256)" filter="url(#glow-heavy)">
    <!-- 吊牌挂绳 -->
    <path d="M 256 160 C 256 110, 220 70, 256 40 C 290 70, 256 110, 256 160" fill="none" stroke="url(#free-grad-cyan-purple)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    
    <!-- 吊牌半透明磨砂玻璃背板 -->
    <rect x="156" y="140" width="200" height="280" rx="32" fill="rgba(30, 30, 46, 0.75)" stroke="url(#free-grad-cyan-purple)" stroke-width="6" />

    <!-- 吊牌小圆孔 -->
    <circle cx="256" cy="180" r="12" fill="#1E1E2E" stroke="url(#free-grad-cyan-purple)" stroke-width="4" />

    <!-- 内部发光的 Git 分支电路树 -->
    <g stroke-linejoin="round" stroke-linecap="round">
      <!-- 主干线 -->
      <path d="M 256 192 L 256 260" stroke="url(#free-grad-cyan-purple)" stroke-width="5" />
      
      <!-- 分支线 -->
      <path d="M 256 260 L 210 305 L 210 350" stroke="url(#free-grad-cyan-purple)" stroke-width="4" />
      <path d="M 256 260 L 302 305 L 302 350" stroke="url(#free-grad-pink-orange)" stroke-width="4" />
      <path d="M 256 260 L 256 360" stroke="url(#free-grad-cyan-purple)" stroke-width="4" stroke-dasharray="6 3" />

      <!-- Git 提交节点 (带白色发光内芯) -->
      <circle cx="256" cy="260" r="7" fill="#818CF8" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="210" cy="305" r="5.5" fill="#22D3EE" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="302" cy="305" r="5.5" fill="#F472B6" stroke="#FFFFFF" stroke-width="2" />
      
      <circle cx="210" cy="350" r="8" fill="#22D3EE" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="302" cy="350" r="8" fill="#FB923C" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="256" cy="360" r="8" fill="#C084FC" stroke="#FFFFFF" stroke-width="2.5" />
    </g>
  </g>
</svg>
